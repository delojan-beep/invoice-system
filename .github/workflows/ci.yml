name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Applies every migration and seed.sql to a fresh Postgres, then lints the schema.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db reset --local
      - run: pnpm exec supabase db lint --local --level warning --fail-on error
      # Access rules: who can read and change what (supabase/tests/database).
      - run: pnpm exec supabase test db
